---
- name: Базовая настройка сервера
  hosts: devops_servers
  become: yes
  tasks:
    - name: Обновление apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Установка системных пакетов
      apt:
        name: "{{ system_packages }}"
        state: present

    - name: Настройка часового пояса
      timezone:
        name: "{{ timezone }}"

    - name: Создание директорий для проектов
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/devops
        - /opt/k8s
        - /opt/docker
        - /opt/terraform
        - /opt/ansible