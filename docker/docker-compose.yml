version: '3.8'

services:
  db:
    image: postgres:15
    container_name: digital-backpack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: backpack
      POSTGRES_USER: backpack_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"    # Только localhost!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf  # Экономный конфиг
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backpack_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: